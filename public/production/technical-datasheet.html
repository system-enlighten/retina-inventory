<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retina Technical Datasheet</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#191919;background:#eee;--red:#e62816;--orange:#bd641a}
*{box-sizing:border-box}body{margin:0}.toolbar{padding:12px;text-align:right;max-width:210mm;margin:auto}.toolbar button{font:inherit;padding:7px 12px;background:white;border:1px solid #aaa;cursor:pointer}
.sheet{max-width:210mm;min-height:297mm;margin:0 auto 16px;padding:11mm 14mm 9mm;background:white;display:flex;flex-direction:column}
.hero{display:grid;grid-template-columns:1fr 31%;gap:10mm;min-height:68mm}.brand{font:bold 28px Georgia,serif;letter-spacing:-.045em;line-height:1}
h1{margin:0 0 9mm;font-size:clamp(34px,7vw,72px);line-height:.94;color:var(--red);letter-spacing:-.045em;overflow-wrap:anywhere}
h2{color:#bc2a19;font-size:12px;font-weight:400;margin:0 0 4px}.intro{color:var(--orange);font-size:12px;line-height:1.5;margin:0}
.product-image{display:block;width:100%;height:62mm;object-fit:contain}.product-image[hidden]{display:none}
.details{display:grid;grid-template-columns:24% 35% 1fr;gap:12px;font-size:11px;line-height:1.36;margin-top:3mm}
.identity p,.description p{margin:0 0 4px;overflow-wrap:anywhere}.drawing{border:1px solid #b8b8b8;min-height:27mm;padding:8px;text-align:center;display:grid;align-content:center;color:#555;white-space:pre-line}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;margin-top:5px}.tile{border:1px solid #b8b8b8;min-height:10mm;display:grid;place-items:center;text-align:center;padding:3px;overflow-wrap:anywhere}
.specs{margin-top:9mm;width:82%}.specs h2{margin-bottom:10px}table{border-collapse:collapse;width:100%;font-size:10px}th,td{border-top:1px solid #999;padding:3px 4px;text-align:left;vertical-align:top;overflow-wrap:anywhere}th{font-weight:400;width:54%}tr:last-child>*{border-bottom:1px solid #999}
.footer{display:flex;justify-content:space-between;gap:12px;border-top:1px solid #aaa;margin-top:auto;padding-top:8px;font-size:9px}.foot-space{min-height:11mm}
@media(max-width:560px){.sheet{padding:18px;min-height:auto}.hero{gap:12px;min-height:0}.product-image{height:130px}.details{grid-template-columns:1fr 1fr;margin-top:22px}.visuals{grid-column:1/-1}.specs{width:100%}}
@page{size:A4;margin:0}
@media print{html,body{background:white}.toolbar{display:none}.sheet{max-width:none;width:210mm;min-height:297mm;margin:0;print-color-adjust:exact;-webkit-print-color-adjust:exact}h1{font-size:65px}.details,.specs{break-inside:avoid}}
</style>
</head>
<body>
<div class="toolbar"><button type="button" onclick="window.print()">Print / Save PDF</button></div>
<main class="sheet">
  <header class="hero">
    <div><div class="brand">retina</div><h1 id="title">Technical Datasheet</h1><h2 id="intro-title">Product overview</h2><p id="intro" class="intro"></p></div>
    <img id="image" class="product-image" alt="" hidden>
  </header>
  <div class="details">
    <section class="identity" aria-label="Configuration"><strong id="code"></strong><div id="identity"></div></section>
    <section class="description"><h2>Product description</h2><div id="description"></div></section>
    <aside class="visuals" aria-label="Dimensions and key ratings"><div id="dimensions" class="drawing"></div><div id="tiles" class="tiles"></div></aside>
  </div>
  <section class="specs"><h2>Technical Specs</h2><table aria-label="Technical specifications"><tbody id="specs"></tbody></table></section>
  <div class="foot-space"></div>
  <footer class="footer"><span>Retina Lighting Systems</span><span id="footer-code">Technical datasheet</span></footer>
</main>
<script type="application/json" id="datasheet-data">{}</script>
<script>
const data = JSON.parse(document.getElementById('datasheet-data').textContent);
const byId = id => document.getElementById(id);
const setText = (id,value) => { if (value) byId(id).textContent = value; };
const addText = (parent,tag,value) => {
  const element = document.createElement(tag);
  element.textContent = value;
  parent.append(element);
  return element;
};
setText('title',data.title);
setText('intro',data.intro);
setText('code',data.code);
setText('footer-code',data.code);
setText('dimensions',data.dimensions || 'Dimensions — not recorded');
for (const value of data.identity || []) addText(byId('identity'),'p',value);
for (const value of data.description || []) addText(byId('description'),'p',value);
for (const value of data.tiles || []) addText(byId('tiles'),'div',value).className = 'tile';
for (const [label,value] of data.specs || []) {
  const row = document.createElement('tr');
  addText(row,'th',label).scope = 'row';
  addText(row,'td',value);
  byId('specs').append(row);
}
if (data.image) {
  const url = new URL(data.image, location.href);
  if (['https:','http:'].includes(url.protocol)) {
    const image = byId('image');
    image.alt = data.title || 'Configured luminaire';
    image.addEventListener('error',() => { image.hidden = true; });
    image.src = url.href;
    image.hidden = false;
  }
}
</script>
</body>
</html>
